<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2b2b26" />
  <title>部落纪元</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="topbar">
    <div id="topbar-row">
      <div id="game-title">部落纪元 <span class="tag" id="ver-tag"></span></div>
      <div id="topbar-actions">
        <span id="season-tag"></span>
        <span id="sim-clock"></span>
        <button id="btn-auto" type="button" class="toggle">放任发展</button>
        <button id="btn-cards" type="button">见识图鉴</button>
        <button id="btn-menu" type="button">存档</button>
      </div>
    </div>
    <div id="resource-bar"></div>
  </header>
  <div id="view-tabs">
    <button class="tab on" data-view="camp" type="button">营地</button>
    <button class="tab" data-view="world" type="button">世界</button>
    <button id="btn-recenter" type="button" hidden>归位</button>
  </div>
  <canvas id="camp" width="800" height="180"></canvas>
  <canvas id="worldmap" width="960" height="560" hidden></canvas>
  <main id="layout">
    <section id="panel-pop" class="panel">
      <h2>族人</h2>
      <div id="pop-summary"></div>
      <div id="jobs"></div>
      <div id="actions"></div>
      <h2 style="margin-top:12px">神迹</h2>
      <div id="miracles"></div>
    </section>
    <section id="panel-tech" class="panel">
      <h2>技术图谱</h2>
      <div id="techtree"></div>
    </section>
    <section id="panel-craft" class="panel">
      <h2>工坊</h2>
      <div id="expedition"></div>
      <div id="buildings"></div>
      <div id="recipes"></div>
      <div id="queue"></div>
    </section>
    <section id="panel-log" class="panel">
      <h2>记事</h2>
      <div id="log"></div>
    </section>
  </main>
  <div id="overlay" class="hidden"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
